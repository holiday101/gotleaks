# GotLeaks nginx location block -- replaces the existing Streamlit proxy for
# membergolfonline.com/water/ (likely a `location /water/ { proxy_pass
# http://127.0.0.1:8501; ... }` block with WebSocket upgrade headers, since
# Streamlit needs those -- GotLeaks/Next.js doesn't in production, since
# `next start` isn't a dev server).
#
# This is a SNIPPET to merge into the existing server { } block for
# membergolfonline.com (found with e.g. `sudo nginx -T` or
# /etc/nginx/sites-enabled/*) -- it is NOT a drop-in whole-file replacement,
# since that server block almost certainly serves other things beyond
# /water/ too. Delete the old /water/ location block(s) this replaces.
#
# Order matters: the more specific /water/api/ block must come before the
# more general /water/ block, or nginx's longest-prefix-match will still
# pick the right one regardless of file order -- but keeping the specific
# one first here for readability.

    location /water/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /water/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
